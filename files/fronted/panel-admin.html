<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Libro Mayor — Panel de Administración</title>
<style>
  :root { --verde:#1b3a2f; --marfil:#f7f3ea; --oro:#b8912f; --rojo:#a13c3c; }
  * { box-sizing: border-box; }
  body { font-family: Georgia, serif; background: var(--marfil); margin:0; padding: 32px; color: var(--verde); }
  h1 { font-size: 22px; border-bottom: 2px solid var(--verde); padding-bottom: 10px; }
  #login-box { max-width: 360px; margin: 80px auto; background:#fff; padding: 28px; border-radius: 10px; box-shadow: 0 2px 10px rgba(0,0,0,.1); }
  input { width:100%; padding:10px; margin:6px 0 14px; border:1px solid #ccc; border-radius:6px; font-size:14px; }
  button { background: var(--verde); color:#fff; border:none; padding:9px 16px; border-radius:6px; cursor:pointer; font-size:13px; }
  button:hover { opacity:.9; }
  button.suspender { background: var(--rojo); }
  button.reactivar { background: #2f7d4f; }
  table { width:100%; border-collapse: collapse; background:#fff; border-radius:8px; overflow:hidden; margin-top:16px; }
  th, td { padding:10px 12px; text-align:left; border-bottom:1px solid #eee; font-size:13.5px; }
  th { background: var(--verde); color: var(--marfil); }
  .pill { padding:3px 9px; border-radius:20px; font-size:11.5px; font-weight:bold; }
  .pill-activo { background:#dff3e4; color:#2f7d4f; }
  .pill-suspendido { background:#fbe2e2; color:var(--rojo); }
  #error { color: var(--rojo); font-size:13px; }
  #config { font-size:12px; color:#666; margin-bottom:16px; }
</style>
</head>
<body>

<div id="login-box">
  <h1>Panel de Administración</h1>
  <div id="config">
    URL del backend:
    <input id="api-url" value="http://localhost:4000" />
  </div>
  <input id="email" placeholder="Tu email de administrador" />
  <div style="position: relative;">
    <input id="password" type="password" placeholder="Tu contraseña" style="padding-right: 40px;" />
    <button type="button" onclick="togglePassword()" style="position: absolute; right: 8px; top: 8px; background: none; border: none; padding: 4px; cursor: pointer; font-size: 16px;" title="Mostrar/ocultar contraseña">👁️</button>
  </div>
  <button onclick="login()">Entrar</button>
  <p id="error"></p>
</div>

<div id="panel" style="display:none; max-width: 900px; margin: 0 auto;">
  <h1>Tus clientes (tenants)</h1>
  <table>
    <thead>
      <tr><th>Negocio</th><th>Email</th><th>Estado</th><th>Próximo cobro</th><th>Intentos fallidos</th><th>Acciones</th></tr>
    </thead>
    <tbody id="tabla-tenants"></tbody>
  </table>
</div>

<script>
  let token = null;
  const apiUrl = () => document.getElementById("api-url").value.replace(/\/$/, "");

  function togglePassword() {
    const campo = document.getElementById("password");
    campo.type = campo.type === "password" ? "text" : "password";
  }

  async function login() {
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;
    try {
      const res = await fetch(`${apiUrl()}/api/admin/login`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Error de login");
      token = data.token;
      document.getElementById("login-box").style.display = "none";
      document.getElementById("panel").style.display = "block";
      cargarTenants();
    } catch (e) {
      document.getElementById("error").innerText = e.message;
    }
  }

  async function cargarTenants() {
    const res = await fetch(`${apiUrl()}/api/admin/tenants`, {
      headers: { Authorization: `Bearer ${token}` },
    });
    const tenants = await res.json();
    const tbody = document.getElementById("tabla-tenants");
    tbody.innerHTML = tenants.map(t => `
      <tr>
        <td>${t.nombre_negocio}</td>
        <td>${t.email_contacto}</td>
        <td><span class="pill pill-${t.estado}">${t.estado}</span></td>
        <td>${t.proximo_cobro ?? "—"}</td>
        <td>${t.intentos_fallidos ?? 0}</td>
        <td>
          ${t.estado === "activo"
            ? `<button class="suspender" onclick="accion(${t.id}, 'suspender')">Suspender</button>`
            : `<button class="reactivar" onclick="accion(${t.id}, 'reactivar')">Reactivar</button>`}
          <button onclick="resetPassword(${t.id})">Resetear clave</button>
        </td>
      </tr>
    `).join("");
  }

  async function accion(tenantId, tipo) {
    await fetch(`${apiUrl()}/api/admin/tenants/${tenantId}/${tipo}`, {
      method: "POST",
      headers: { Authorization: `Bearer ${token}` },
    });
    cargarTenants();
  }

  async function resetPassword(tenantId) {
    const res = await fetch(`${apiUrl()}/api/admin/tenants/${tenantId}/reset-password`, {
      method: "POST",
      headers: { Authorization: `Bearer ${token}` },
    });
    const data = await res.json();
    alert(`Contraseña temporal para este cliente: ${data.passwordTemporal}\n\nPásasela por WhatsApp o llamada.`);
  }
</script>
</body>
</html>
